services:
  - type: web
    name: ner-extraction-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /docs
    envVars:
      # Secrets are set in the Render dashboard, never stored in this file.
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
